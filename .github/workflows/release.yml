name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com
          scope: '@gigradar'

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build packages
        run: npm run build --workspaces --if-present

      # Versions and publishes in one run — there is no "Version Packages" PR.
      #
      # A push to `main` carrying pending changesets bumps the versions, writes
      # the changelogs, publishes to GitHub Packages, and pushes the version
      # commit back here. Nothing to review or merge.
      #
      # The tradeoff is deliberate: publishing is irreversible, and this removes
      # the step where the computed version and changelog could be read first.
      # Anything wrong in a changeset ships. Re-read `.changeset/*.md` before
      # pushing, especially where several have accumulated — Changesets
      # concatenates them without noticing that a later one contradicts an
      # earlier one.
      #
      # A push with NO pending changesets publishes nothing, so ordinary commits
      # are safe.
      - name: Version and publish
        run: |
          set -euo pipefail

          if [ -z "$(ls .changeset/*.md 2>/dev/null | grep -v README || true)" ]; then
            echo "No pending changesets — nothing to publish."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          npm run version-packages
          npm install --package-lock-only --no-audit --no-fund

          git add -A
          git commit -m "chore: version packages [skip ci]"

          npm run release

          # Push the version bump and the tags Changesets created, so the repo
          # reflects what is on the registry.
          git push origin HEAD:main --follow-tags

          # Turn each new tag into a GitHub Release, with that package's own
          # changelog entry as the notes.
          #
          # `changeset publish` writes tags but not Releases — the official
          # changesets/action did that, and this workflow replaced it. Without
          # this step the Releases page silently stops at the last version that
          # action published, so the repo advertises an old version while the
          # registry has a newer one.
          for tag in $(git tag --points-at HEAD); do
            pkg=$(echo "$tag" | sed 's|^@gigradar/||; s|@.*$||')
            version=$(echo "$tag" | sed 's|^.*@||')
            notes=$(awk -v v="## $version" '
              $0 == v { found = 1; next }
              found && /^## / { exit }
              found { print }
            ' "packages/$pkg/CHANGELOG.md")
            gh release create "$tag" --title "$tag" \
              --notes "${notes:-See CHANGELOG.md}" || true
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
